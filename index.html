<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Diamond Diving CRM</title>
<style>
:root{--bg:#0b1a24;--panel:#12252f;--panel2:#17303c;--line:#22414f;--text:#e8f1f5;--muted:#8fb0be;--accent:#12b5a5;--warn:#f0b429;--bad:#e5484d;--radius:12px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0 0 .5rem}
#app{max-width:960px;margin:0 auto;padding:0 12px 90px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(11,26,36,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 -12px 14px}
.brand{font-weight:700}.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi b{display:block;font-size:26px}.kpi span{color:var(--muted);font-size:12px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04201d;font-weight:600}
.btn.ghost{background:transparent}.btn.sm{padding:6px 9px;font-size:12px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;background:#0d1f28;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;font-size:15px;font-family:inherit}
textarea{min-height:70px}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:600}
.pill.proposed{background:#3a3320;color:var(--warn)}.pill.scheduled{background:#14323a;color:#6fd3e0}
.pill.in_progress{background:#1d2f4d;color:#7fb0ff}.pill.done{background:#173421;color:#7ee08f}
.pill.not_found,.pill.postponed{background:#3b2a1a;color:#f0a35e}.pill.canceled{background:#3a1d1f;color:#ff9a9c}
.pill.pending{background:#3a3320;color:var(--warn)}.pill.paid{background:#173421;color:#7ee08f}
.jobrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--panel2)}
.jobrow .meta{color:var(--muted);font-size:12px;margin-top:2px}
.jobrow .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.list-item:last-child{border-bottom:0}
.muted{color:var(--muted)}.small{font-size:12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,26,36,.98);border-top:1px solid var(--line);display:flex;z-index:30}
.nav a{flex:1;text-align:center;padding:9px 4px 12px;font-size:11px;color:var(--muted);text-decoration:none}
.nav a.active{color:var(--accent)}.nav a b{display:block;font-size:17px;font-weight:400}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#04201d;border:1px solid var(--accent);padding:10px 14px;border-radius:9px;z-index:60;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;z-index:40}
.modal-box{background:var(--panel);width:100%;max-height:85vh;border-radius:14px 14px 0 0;padding:14px;display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.msgbox{white-space:pre-wrap;background:#0d1f28;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-family:inherit;font-size:14px;max-height:60vh}
.banner{background:#3a3320;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}.section-title h2{font-size:17px}
a{color:var(--accent)}
@media(min-width:640px){.modal{align-items:center}.modal-box{border-radius:14px;max-width:560px;margin:0 auto}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-box"><div class="modal-head"><strong id="modal-title"></strong><button class="btn sm ghost" onclick="closeModal()">✕</button></div><pre id="modal-body" class="msgbox"></pre><div style="margin-top:10px"><button class="btn primary" onclick="copyModal()">Copiar texto</button></div></div></div>
<script>
'use strict';
// ================= armazenamento resiliente =================
var LSKEY='dd_crm_v1';
var S={data:null,persistent:true};

function blank(){
  return {clients:[],boats:[],jobs:[],reports:[],invoices:[],
    settings:{role:'admin',diverName:'Christopher',divers:['Christopher','Eduardo'],services:[
      {id:1,name:'Bottom cleaning',price:150},
      {id:2,name:'Interior cleaning',price:200},
      {id:3,name:'Wash & polish',price:250},
      {id:4,name:'Bottom cleaning + running gear',price:200},
      {id:5,name:'Zinc replacement',price:0}
    ]},seq:{clients:0,boats:0,jobs:0,invoices:0}};
}
function testStorage(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; }
}
function load(){
  S.persistent=testStorage();
  if(!S.persistent){ S.data=blank(); return; }
  try{
    var raw=localStorage.getItem(LSKEY);
    if(!raw){ S.data=blank(); save(); }
    else { S.data=JSON.parse(raw); }
  }catch(e){ S.persistent=false; S.data=blank(); }
}
function save(){
  if(!S.persistent) return;
  try{ localStorage.setItem(LSKEY,JSON.stringify(S.data)); }
  catch(e){ S.persistent=false; alert('Nao foi possivel salvar automaticamente neste navegador. Use Exportar backup e Importar backup.'); render(); }
}
function uid(t){ S.data.seq[t]=(S.data.seq[t]||0)+1; return S.data.seq[t]; }

// ================= util =================
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var STATUS={proposed:'Proposta',scheduled:'Agendado',in_progress:'Em execucao',done:'Concluido',not_found:'Nao encontrado',postponed:'Adiado',canceled:'Cancelado'};
var FREQ={weekly:'Semanal',biweekly:'Quinzenal',monthly:'Mensal',one_time:'Avulso'};
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(d){ if(!d) return ''; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function toast(m){ var t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},2200); }
function byId(t,id){ return S.data[t].find(function(x){return x.id===id;}); }
function isAdmin(){ return (S.data.settings.role||'admin')==='admin'; }
function currentDiver(){ return S.data.settings.diverName||'Christopher'; }
function switchRole(v){
  if(v==='admin'){ S.data.settings.role='admin'; }
  else { var p=v.split('|'); S.data.settings.role='diver'; S.data.settings.diverName=p[1]||'Christopher'; }
  save();
  if(!isAdmin()&&location.hash.indexOf('#/job/')!==0) location.hash='#/agenda';
  render();
}
function nextDate(dateStr,freq){
  var p=dateStr.split('-'); var d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  if(freq==='weekly') d.setDate(d.getDate()+7);
  else if(freq==='biweekly') d.setDate(d.getDate()+14);
  else if(freq==='monthly') d.setMonth(d.getMonth()+1);
  else return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ================= shell =================
function shell(active,content){
  var link=function(h,k,i,l){return '<a href="'+h+'" class="'+(active===k?'active':'')+'"><b>'+i+'</b>'+l+'</a>';};
  var warn=S.persistent?'':'<div class="banner">⚠️ Este navegador nao esta salvando automaticamente (abriu como arquivo local). Exporte um backup antes de fechar. <a href="#/settings">Abrir backup</a></div>';
  var roleOpts='<option value="admin"'+(isAdmin()?' selected':'')+'>Office (ADM)</option>'+S.data.settings.divers.map(function(d){return '<option value="diver|'+esc(d)+'"'+(!isAdmin()&&currentDiver()===d?' selected':'')+'>Mergulhador · '+esc(d)+'</option>';}).join('');
  var nav=link('#/dashboard','dashboard','▦','Painel')+link('#/agenda','agenda','🗓',isAdmin()?'Agenda':'Meu dia');
  if(isAdmin()) nav+=link('#/clients','clients','👤','Clientes')+link('#/boats','boats','⛵','Barcos')+link('#/finance','finance','$','Cobranca');
  $('#app').innerHTML=
   '<div class="topbar"><div class="brand">Diamond Diving<small>'+(isAdmin()?'Office (ADM)':'Mergulhador · '+esc(currentDiver()))+'</small></div><div class="spacer"></div>'+
   '<select onchange="switchRole(this.value)" style="width:auto;padding:6px;font-size:12px">'+roleOpts+'</select>'+
   '<a class="btn sm ghost" href="#/settings">Backup</a></div>'+warn+content+
   '<nav class="nav">'+nav+'</nav>';
}

// ================= dashboard =================
function viewDashboard(){
  var t=today();
  var mine=function(j){return isAdmin()||j.diver===currentDiver();};
  var todays=S.data.jobs.filter(function(j){return j.scheduled_date===t&&mine(j);}).sort(function(a,b){return a.sequence-b.sequence;});
  var pending=S.data.invoices.filter(function(i){return i.status==='pending';});
  var total=pending.reduce(function(s,i){return s+Number(i.amount||0);},0);
  var proposed=S.data.jobs.filter(function(j){return j.status==='proposed';}).length;
  var rows=todays.length?todays.map(function(j){var b=byId('boats',j.boat_id)||{};return '<div class="jobrow"><div><strong>'+esc(b.name||'Sem nome')+'</strong> <span class="pill '+j.status+'">'+STATUS[j.status]+'</span></div><div class="meta">'+esc(j.optional_time||'')+' · '+esc(j.diver||'sem mergulhador')+' · '+esc(b.marina||'marina nao informada')+'</div><div class="actions"><button class="btn sm" onclick="location.hash=\'#/job/'+j.id+'\'">Abrir</button></div></div>';}).join(''):'<p class="muted small">Nenhum barco agendado para hoje.</p>';
  var kpis=isAdmin()
    ? '<div class="kpi"><b>'+todays.length+'</b><span>Barcos hoje ('+fmtDate(t)+')</span></div><div class="kpi"><b>'+pending.length+'</b><span>Cobrancas pendentes</span></div><div class="kpi"><b>US$ '+total.toFixed(0)+'</b><span>A receber</span></div><div class="kpi"><b>'+proposed+'</b><span>Propostas de recorrencia</span></div>'
    : '<div class="kpi"><b>'+todays.length+'</b><span>Meus barcos hoje ('+fmtDate(t)+')</span></div><div class="kpi"><b>'+todays.filter(function(j){return j.status==='done';}).length+'</b><span>Concluidos hoje</span></div>';
  shell('dashboard','<div class="grid">'+kpis+'</div><div class="card"><h3>'+(isAdmin()?'Barcos de hoje':'Meu dia')+'</h3>'+rows+'</div>');
}

// ================= agenda =================
function viewAgenda(){
  var date=(location.hash.split('date=')[1])||today();
  var jobs=S.data.jobs.filter(function(j){return j.scheduled_date===date&&(isAdmin()||j.diver===currentDiver());}).sort(function(a,b){return a.sequence-b.sequence;});
  var divers={};jobs.forEach(function(j){var k=j.diver||'Sem mergulhador';(divers[k]=divers[k]||[]).push(j);});
  var list=Object.keys(divers).map(function(d){return '<div class="card"><div class="section-title"><h2>'+esc(d)+'</h2><button class="btn sm ghost" onclick="daySheet(\''+date+'\',\''+esc(d).replace(/'/g,"\\'")+'\')">Texto do dia</button></div>'+divers[d].map(jobRow).join('')+'</div>';}).join('')||'<p class="muted small">Nada agendado nesta data.</p>';
  var prop=isAdmin()?S.data.jobs.filter(function(j){return j.status==='proposed';}):[];
  var propHtml=prop.length?'<div class="card"><h3>Propostas de recorrencia</h3>'+prop.map(function(j){var b=byId('boats',j.boat_id)||{};return '<div class="jobrow"><div><strong>'+esc(b.name)+'</strong> · '+fmtDate(j.scheduled_date)+' <span class="pill proposed">Proposta</span></div><div class="meta">'+esc(FREQ[b.frequency]||'')+' · '+esc(j.diver||'sem mergulhador')+'</div><div class="actions"><button class="btn sm primary" onclick="setStatus('+j.id+',\'scheduled\')">Confirmar</button><button class="btn sm" onclick="location.hash=\'#/job/'+j.id+'\'">Abrir</button></div></div>';}).join('')+'</div>':'';
  shell('agenda','<div class="card"><label>Data</label><input type="date" value="'+date+'" onchange="location.hash=\'#/agenda?date=\'+this.value">'+(isAdmin()?'<div class="section-title"><h2>Novo agendamento</h2></div><div id="newjob"></div>':'<p class="small muted">Seus barcos do dia. Abra cada um para ver acesso, servico e preencher o relatorio.</p>')+'</div>'+list+propHtml);
  if(isAdmin()) renderNewJobForm(date);
}
function jobRow(j){
  var b=byId('boats',j.boat_id)||{};var c=b.client_id?byId('clients',b.client_id):null;
  var svc=(S.data.settings.services.find(function(s){return s.id===j.service_id;})||{}).name||'Servico';
  return '<div class="jobrow"><div><strong>'+esc(b.name||'Sem nome')+'</strong> '+(j.optional_time?'<span class="muted small">'+esc(j.optional_time)+'</span>':'')+' <span class="pill '+j.status+'">'+STATUS[j.status]+'</span></div><div class="meta">'+esc(svc)+' · '+esc(b.marina||'—')+(b.slip?' / '+esc(b.slip):'')+' · '+esc(c?c.name:'cliente nao informado')+'</div>'+(b.access_notes?'<div class="meta">🔑 '+esc(b.access_notes)+'</div>':'')+'<div class="actions"><button class="btn sm" onclick="location.hash=\'#/job/'+j.id+'\'">Abrir</button>'+((j.status!=='done')?'<button class="btn sm primary" onclick="quickDone('+j.id+')">Concluir</button>':'')+'</div></div>';
}
function renderNewJobForm(date){
  var boats=S.data.boats;
  var bopts=boats.map(function(b){return '<option value="'+b.id+'">'+esc(b.name||'Barco '+b.id)+'</option>';}).join('');
  var sopts=S.data.settings.services.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>';}).join('');
  var dopts=S.data.settings.divers.map(function(d){return '<option value="'+esc(d)+'">'+esc(d)+'</option>';}).join('');
  $('#newjob').innerHTML=
    '<label>Barco</label><select id="nj_boat">'+(bopts||'<option value="">Cadastre um barco primeiro</option>')+'</select>'+
    '<div class="row"><div style="flex:1"><label>Servico</label><select id="nj_service">'+sopts+'</select></div>'+
    '<div style="flex:1"><label>Mergulhador</label><select id="nj_diver">'+dopts+'</select></div></div>'+
    '<div class="row"><div style="flex:1"><label>Valor (US$)</label><input id="nj_price" type="number" step="0.01"></div>'+
    '<div style="flex:1"><label>Hora (opcional)</label><input id="nj_time" placeholder="ex: 9:00"></div></div>'+
    '<button class="btn primary" style="margin-top:12px" onclick="createJob(\''+date+'\')">Agendar</button>';
}
function createJob(date){
  var bid=Number($('#nj_boat').value); if(!bid) return toast('Selecione um barco');
  var b=byId('boats',bid)||{};
  var svcId=Number($('#nj_service').value)||null;
  var svc=S.data.settings.services.find(function(s){return s.id===svcId;})||{};
  var price=$('#nj_price').value!==''?Number($('#nj_price').value):(b.default_price!=null?b.default_price:(svc.price||0));
  var id=uid('jobs');
  S.data.jobs.push({id:id,boat_id:bid,service_id:svcId,diver:$('#nj_diver').value||null,scheduled_date:date,sequence:S.data.jobs.filter(function(j){return j.scheduled_date===date;}).length+1,optional_time:$('#nj_time').value,status:'scheduled',price:price,notes:''});
  save();toast('Agendado');render();
}
function quickDone(id){setStatus(id,'done');}
function setStatus(id,st){
  var j=byId('jobs',id); if(!j) return;
  var prev=j.status; j.status=st;
  if(st==='done'&&prev!=='done'){
    var b=byId('boats',j.boat_id)||{}; var nd=nextDate(j.scheduled_date,b.frequency||'one_time');
    if(nd){ var exists=S.data.jobs.some(function(x){return x.boat_id===j.boat_id&&x.scheduled_date===nd&&(x.status==='proposed'||x.status==='scheduled');});
      if(!exists){ S.data.jobs.push({id:uid('jobs'),boat_id:j.boat_id,service_id:j.service_id,diver:j.diver,scheduled_date:nd,sequence:0,status:'proposed',price:j.price,notes:'Recorrencia automatica ('+FREQ[b.frequency]+')'}); } }
  }
  save();toast('Atualizado');render();
}

// ================= job detail =================
function viewJob(id){
  var j=byId('jobs',id); if(!j) return toast('OS nao encontrada');
  if(!isAdmin()&&j.diver!==currentDiver()){ toast('Esta OS e de outro mergulhador'); location.hash='#/agenda'; return; }
  var b=byId('boats',j.boat_id)||{}; var c=b.client_id?byId('clients',b.client_id):null;
  var r=S.data.reports.find(function(x){return x.job_id===id;})||{};
  var inv=S.data.invoices.find(function(x){return x.job_id===id;});
  var svc=(S.data.settings.services.find(function(s){return s.id===j.service_id;})||{}).name||'Servico';
  var opt=function(v){return ['good','medium','bad','none'].map(function(o){return '<option value="'+o+'"'+(v===o?' selected':'')+'>'+(o==='none'?'None / N/A':o.charAt(0).toUpperCase()+o.slice(1))+'</option>';}).join('');};
  shell('agenda','<div class="card"><div class="section-title"><h2>'+esc(b.name||'Barco')+'</h2><span class="pill '+j.status+'">'+STATUS[j.status]+'</span></div>'+
   '<div class="small muted">'+esc(b.make||'')+' '+esc(b.model||'')+(b.length_ft?' '+b.length_ft+"'":'')+' · '+esc(b.marina||'—')+(b.slip?' / '+esc(b.slip):'')+'</div>'+
   '<div class="small muted">Cliente: '+esc(c?c.name:'nao informado')+(c&&c.phone?' · '+esc(c.phone):'')+'</div>'+
   (b.access_notes?'<div class="small" style="color:var(--warn)">🔑 Acesso: '+esc(b.access_notes)+'</div>':'')+
   '<div class="small muted">'+esc(svc)+' · '+fmtDate(j.scheduled_date)+(j.optional_time?' '+esc(j.optional_time):'')+' · '+esc(j.diver||'sem mergulhador')+'</div>'+
   '<div class="row" style="margin-top:10px">'+['scheduled','in_progress','done','not_found','postponed'].map(function(s){return '<button class="btn sm '+(s===j.status?'primary':'')+'" onclick="setStatus('+j.id+',\''+s+'\')">'+STATUS[s]+'</button>';}).join('')+'</div>'+
   (isAdmin()?'<label>Valor (US$)</label><div class="row"><input id="jp" type="number" step="0.01" value="'+(j.price==null?'':j.price)+'" style="flex:1"><button class="btn" onclick="savePrice('+j.id+')">Salvar</button></div><div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="msgClientConfirm('+j.id+')">Texto p/ cliente (confirmacao)</button>'+(r.bottom_paint?'<button class="btn sm ghost" onclick="msgReport('+j.id+')">Texto do relatorio</button>':'')+'</div>':'<div class="row" style="margin-top:10px">'+(r.bottom_paint?'<button class="btn sm ghost" onclick="msgReport('+j.id+')">Texto do relatorio</button>':'')+'</div>')+'</div>'+ 

   '<div class="card"><h3>Relatorio de limpeza</h3>'+
   '<label>Fundo / pintura</label><select id="r_bottom">'+opt(r.bottom_paint)+'</select>'+
   '<label>Waterline</label><select id="r_water">'+opt(r.waterline)+'</select><input id="r_water_note" placeholder="Observacao waterline" value="'+esc(r.waterline_note)+'">'+
   '<label>Running gear</label><select id="r_gear">'+opt(r.running_gear)+'</select><input id="r_gear_note" placeholder="Observacao running gear" value="'+esc(r.running_gear_note)+'">'+
   '<label>Intakes</label><label class="small" style="color:var(--text)"><input type="checkbox" id="r_intakes" style="width:auto;margin-right:6px"'+(r.intakes_clean?' checked':'')+'>Limpos e sem detritos</label><input id="r_intakes_note" placeholder="Observacao intakes" value="'+esc(r.intakes_note)+'">'+
   '<label>Zinco</label><select id="r_zinc">'+opt(r.zinc)+'</select><input id="r_zinc_note" placeholder="Zinco: posicao/quantidade (ex: 04 shaft, 3 motors, trim tabs)" value="'+esc(r.zinc_note)+'">'+
   '<label>Danos aparentes</label><textarea id="r_damage">'+esc(r.damage_note)+'</textarea>'+
   '<label>Observacoes gerais</label><textarea id="r_general">'+esc(r.general_note)+'</textarea>'+
   '<button class="btn primary" style="margin-top:10px" onclick="saveReport('+j.id+')">Salvar relatorio</button></div>'+

   (isAdmin()?'<div class="card"><h3>Cobranca</h3>'+(inv?
     ('<div class="small">US$ '+Number(inv.amount).toFixed(2)+' · '+esc(inv.method||'forma?')+' · <span class="pill '+inv.status+'">'+(inv.status==='paid'?'Pago':'Pendente')+'</span></div>'+
      '<div class="row" style="margin-top:8px">'+(inv.status!=='paid'?'<button class="btn sm primary" onclick="payInvoice('+inv.id+',\'zelle\')">Pago (Zelle)</button><button class="btn sm" onclick="payInvoice('+inv.id+',\'card\')">Pago (Cartao)</button>':'')+'</div>')
     :('<div class="small muted">Sem cobranca para esta OS.</div><div class="row" style="margin-top:8px"><input id="inv_amt" type="number" step="0.01" value="'+(j.price==null?'':j.price)+'" style="flex:1"><select id="inv_m" style="width:auto"><option value="card">Cartao</option><option value="zelle">Zelle</option><option value="cash">Dinheiro</option></select><button class="btn" onclick="createInvoice('+j.id+')">Gerar cobranca</button></div>'))+'</div>':'')+
   '<a class="small" href="#/agenda?date='+j.scheduled_date+'">← voltar para a agenda</a></div>');
}
function savePrice(id){var j=byId('jobs',id);j.price=$('#jp').value===''?null:Number($('#jp').value);save();toast('Valor salvo');}
function saveReport(id){
  var r=S.data.reports.find(function(x){return x.job_id===id;});
  var body={job_id:id,bottom_paint:$('#r_bottom').value,waterline:$('#r_water').value,waterline_note:$('#r_water_note').value,running_gear:$('#r_gear').value,running_gear_note:$('#r_gear_note').value,intakes_clean:$('#r_intakes').checked,intakes_note:$('#r_intakes_note').value,zinc:$('#r_zinc').value,zinc_note:$('#r_zinc_note').value,damage_note:$('#r_damage').value,general_note:$('#r_general').value};
  if(r){ Object.assign(r,body); } else { S.data.reports.push(body); }
  save();toast('Relatorio salvo');render();
}
function createInvoice(jobId){
  var j=byId('jobs',jobId);var b=byId('boats',j.boat_id)||{};
  var id=uid('invoices');
  S.data.invoices.push({id:id,job_id:jobId,client_id:b.client_id||null,amount:Number($('#inv_amt').value||0),method:$('#inv_m').value,status:'pending'});
  if(j.price==null){j.price=Number($('#inv_amt').value||0);}
  save();toast('Cobranca criada');render();
}
function payInvoice(id,method){var i=byId('invoices',id);i.status='paid';i.method=method;i.paid_at=new Date().toISOString();save();toast('Pago');render();}

// ================= clients =================
function viewClients(){
  var list=S.data.clients;
  shell('clients','<div class="card"><h3>Novo cliente</h3><label>Nome*</label><input id="c_name"><div class="row"><div style="flex:1"><label>Telefone</label><input id="c_phone" placeholder="+1 ..."></div><div style="flex:1"><label>E-mail</label><input id="c_email"></div></div><label>Endereco</label><input id="c_addr"><label>Observacoes</label><input id="c_notes"><button class="btn primary" style="margin-top:10px" onclick="saveClient()">Salvar cliente</button></div>'+
   '<div class="card"><h3>Clientes ('+list.length+')</h3>'+(list.map(function(c){return '<div class="list-item"><div><strong>'+esc(c.name)+'</strong><div class="small muted">'+esc(c.phone||'')+(c.email?' · '+esc(c.email):'')+(c.address?' · '+esc(c.address):'')+'</div></div><button class="btn sm ghost" onclick="editClient('+c.id+')">Editar</button></div>';}).join('')||'<p class="muted small">Nenhum cliente.</p>')+'</div>');
}
function editClient(id){var c=byId('clients',id);$('#c_name').value=c.name||'';$('#c_phone').value=c.phone||'';$('#c_email').value=c.email||'';$('#c_addr').value=c.address||'';$('#c_notes').value=c.notes||'';window._ec=id;toast('Editando '+c.name+' — salve para atualizar');}
function saveClient(){
  var name=$('#c_name').value.trim(); if(!name) return toast('Nome obrigatorio');
  var body={name:name,phone:$('#c_phone').value,email:$('#c_email').value,address:$('#c_addr').value,notes:$('#c_notes').value};
  if(window._ec){ Object.assign(byId('clients',window._ec),body); window._ec=null; } else { body.id=uid('clients'); S.data.clients.push(body); }
  save();toast('Salvo');render();
}

// ================= boats =================
function viewBoats(){
  var cl=S.data.clients;
  shell('boats','<div class="card"><h3>Novo barco</h3><label>Cliente</label><select id="b_client"><option value="">—</option>'+cl.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('')+'</select>'+
   '<div class="row"><div style="flex:1"><label>Nome do barco</label><input id="b_name"></div><div style="flex:1"><label>Comprimento (pes)</label><input id="b_len" type="number"></div></div>'+
   '<div class="row"><div style="flex:1"><label>Marca (casco)</label><input id="b_make"></div><div style="flex:1"><label>Modelo</label><input id="b_model"></div></div>'+
   '<label>HIN (n do casco)</label><input id="b_hin" placeholder="12 caracteres — peca ao proprietario">'+
   '<div class="row"><div style="flex:1"><label>Marina</label><input id="b_marina"></div><div style="flex:1"><label>Slip</label><input id="b_slip"></div></div>'+
   '<label>Acesso (gate code, peculiaridades)</label><textarea id="b_access" placeholder="ex: gate code 1234; entrar pelo pier B"></textarea>'+
   '<div class="row"><div style="flex:1"><label>Frequencia</label><select id="b_freq">'+Object.keys(FREQ).map(function(k){return '<option value="'+k+'"'+(k==='monthly'?' selected':'')+'>'+FREQ[k]+'</option>';}).join('')+'</select></div><div style="flex:1"><label>Valor padrao (US$)</label><input id="b_price" type="number" step="0.01"></div></div>'+
   '<label class="small" style="color:var(--text)"><input type="checkbox" id="b_video" style="width:auto;margin-right:6px">Exigir video do servico</label>'+
   '<button class="btn primary" style="margin-top:10px" onclick="saveBoat()">Salvar barco</button></div>'+
   '<div class="card"><h3>Barcos ('+S.data.boats.length+')</h3>'+(S.data.boats.map(function(b){var c=b.client_id?byId('clients',b.client_id):null;return '<div class="list-item"><div><strong>'+esc(b.name||'Barco '+b.id)+'</strong>'+(b.length_ft?' <span class="muted small">'+b.length_ft+"'</span>":'')+'<div class="small muted">'+esc(c?c.name:'sem cliente')+' · '+esc(b.marina||'—')+' · '+esc(FREQ[b.frequency]||'')+(b.hin?' · HIN '+esc(b.hin):'')+'</div>'+(b.access_notes?'<div class="small" style="color:var(--warn)">🔑 '+esc(b.access_notes)+'</div>':'')+'</div><button class="btn sm ghost" onclick="editBoat('+b.id+')">Editar</button></div>';}).join('')||'<p class="muted small">Nenhum barco.</p>')+'</div>');
}
function editBoat(id){var b=byId('boats',id);$('#b_client').value=b.client_id||'';$('#b_name').value=b.name||'';$('#b_len').value=b.length_ft||'';$('#b_make').value=b.make||'';$('#b_model').value=b.model||'';$('#b_hin').value=b.hin||'';$('#b_marina').value=b.marina||'';$('#b_slip').value=b.slip||'';$('#b_access').value=b.access_notes||'';$('#b_freq').value=b.frequency||'monthly';$('#b_price').value=b.default_price==null?'':b.default_price;$('#b_video').checked=!!b.require_video;window._eb=id;toast('Editando '+(b.name||'barco')+' — salve para atualizar');}
function saveBoat(){
  var body={client_id:Number($('#b_client').value)||null,name:$('#b_name').value.trim(),length_ft:$('#b_len').value||null,make:$('#b_make').value,model:$('#b_model').value,hin:$('#b_hin').value,marina:$('#b_marina').value,slip:$('#b_slip').value,access_notes:$('#b_access').value,frequency:$('#b_freq').value,default_price:$('#b_price').value===''?null:Number($('#b_price').value),require_video:$('#b_video').checked};
  if(!body.name&&!body.hin) return toast('Informe ao menos o nome ou o HIN');
  if(window._eb){ Object.assign(byId('boats',window._eb),body); window._eb=null; } else { body.id=uid('boats'); body.active=1; S.data.boats.push(body); }
  save();toast('Salvo');render();
}

// ================= finance =================
function viewFinance(){
  var inv=S.data.invoices;
  var pending=inv.filter(function(i){return i.status==='pending';});
  var paid=inv.filter(function(i){return i.status==='paid';});
  var row=function(i){var j=i.job_id?byId('jobs',i.job_id):null;var b=j?byId('boats',j.boat_id):null;var c=i.client_id?byId('clients',i.client_id):(b&&b.client_id?byId('clients',b.client_id):null);
    return '<div class="list-item"><div><strong>US$ '+Number(i.amount).toFixed(2)+'</strong> <span class="pill '+i.status+'">'+(i.status==='paid'?'Pago':'Pendente')+'</span><div class="small muted">'+esc(c?c.name:'cliente?')+' · '+esc(b?b.name:'')+' · '+(j?fmtDate(j.scheduled_date):'')+(i.method?' · '+esc(i.method):'')+'</div></div>'+(i.status!=='paid'?'<button class="btn sm primary" onclick="payInvoice('+i.id+',\'zelle\')">Pago</button>':'')+'</div>';};
  var sum=function(a){return a.reduce(function(s,i){return s+Number(i.amount||0);},0);};
  shell('finance','<div class="grid"><div class="kpi"><b>US$ '+sum(pending).toFixed(0)+'</b><span>A receber ('+pending.length+')</span></div><div class="kpi"><b>US$ '+sum(paid).toFixed(0)+'</b><span>Recebido ('+paid.length+')</span></div></div><div class="card"><h3>Pendentes</h3>'+(pending.map(row).join('')||'<p class="muted small">Nada pendente.</p>')+'</div><div class="card"><h3>Pagas</h3>'+(paid.map(row).join('')||'<p class="muted small">Nada pago.</p>')+'</div>');
}

// ================= settings / backup =================
function viewSettings(){
  shell('settings','<div class="card"><h3>Backup (recomendado)</h3><p class="small muted">Salve um arquivo com todos os dados. Se o Safari nao estiver guardando automaticamente, este e o seu seguro.</p><div class="row"><button class="btn primary" onclick="exportBackup()">Exportar backup</button><label class="btn" style="margin:0;cursor:pointer">Importar backup<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label></div><p class="small muted" id="bkstatus">'+(S.persistent?'Armazenamento automatico: OK':'Armazenamento automatico: INDISPONIVEL neste navegador')+'</p></div>'+
   '<div class="card"><h3>Equipe (mergulhadores)</h3><div id="divers">'+S.data.settings.divers.map(function(d,i){return '<div class="list-item">'+esc(d)+' <button class="btn sm ghost" onclick="removeDiver('+i+')">remover</button></div>';}).join('')+'</div><div class="row"><input id="newdiver" placeholder="Nome do mergulhador"><button class="btn" onclick="addDiver()">Adicionar</button></div></div>'+
   '<div class="card"><h3>Zerar dados</h3><p class="small muted">Apaga clientes, barcos, OS, relatorios e cobrancas deste aparelho.</p><button class="btn" style="border-color:var(--bad);color:var(--bad)" onclick="wipe()">Apagar tudo</button></div>');
}
function addDiver(){var n=$('#newdiver').value.trim();if(!n)return;S.data.settings.divers.push(n);save();render();}
function removeDiver(i){S.data.settings.divers.splice(i,1);save();render();}
function exportBackup(){
  var blob=new Blob([JSON.stringify(S.data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='diamond-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup exportado');
}
function importBackup(inp){
  var f=inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){ try{ var d=JSON.parse(rd.result); if(!d.clients||!d.boats) throw new Error('formato'); S.data=d; save(); toast('Backup importado'); render(); }catch(e){ alert('Arquivo invalido'); } };
  rd.readAsText(f);
}
function wipe(){ if(!confirm('Apagar TODOS os dados?')) return; S.data=blank(); save(); toast('Apagado'); render(); }

// ================= mensagens =================
function openModal(t,x){$('#modal-title').textContent=t;$('#modal-body').textContent=x;$('#modal').hidden=false;}
function closeModal(){$('#modal').hidden=true;}
function copyModal(){ var t=$('#modal-body').textContent; if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('Copiado');},function(){toast('Copie manualmente');});} else {toast('Copie manualmente');} }
function msgClientConfirm(id){
  var j=byId('jobs',id);var b=byId('boats',j.boat_id)||{};var c=b.client_id?byId('clients',b.client_id):null;
  var svc=(S.data.settings.services.find(function(s){return s.id===j.service_id;})||{}).name||'bottom cleaning';
  openModal('Mensagem para o cliente','Hi '+(c?c.name:'')+', this is Diamond Diving. Your boat "'+(b.name||'')+'" is scheduled for '+fmtDate(j.scheduled_date)+(j.optional_time?' at '+j.optional_time:'')+'. Service: '+svc+'. '+(b.access_notes?'Access note: '+b.access_notes+'. ':'')+'We will send photos and the report after the service. Thanks!');
}
function msgReport(id){
  var j=byId('jobs',id);var b=byId('boats',j.boat_id)||{};
  var r=S.data.reports.find(function(x){return x.job_id===id;}); if(!r) return toast('Sem relatorio');
  var p=function(v){return v?v.charAt(0).toUpperCase()+v.slice(1):'—';};
  var t='Report '+fmtDate(j.scheduled_date)+'\n\n'+(b.name||'')+(b.length_ft?' '+b.length_ft+"'":'')+'\n'+
    'Bottom paint: '+p(r.bottom_paint)+(r.waterline?' / Waterline: '+p(r.waterline):'')+(r.waterline_note?' ('+r.waterline_note+')':'')+'\n'+
    'Running gear: '+p(r.running_gear)+(r.running_gear_note?' ('+r.running_gear_note+')':'')+'\n'+
    'Intakes: '+(r.intakes_clean?'Clean and clear of debris':'See note')+(r.intakes_note?' ('+r.intakes_note+')':'')+'\n'+
    'Zinc: '+p(r.zinc)+(r.zinc_note?' '+r.zinc_note:'')+'\n'+
    (r.damage_note?'Damage: '+r.damage_note+'\n':'')+(r.general_note?'Notes: '+r.general_note+'\n':'');
  openModal('Texto do relatorio',t);
}
function daySheet(date,diver){
  var arr=S.data.jobs.filter(function(j){return j.scheduled_date===date&&(j.diver||'Sem mergulhador')===diver;}).sort(function(a,b){return a.sequence-b.sequence;});
  var t='Schedule '+fmtDate(date)+' — '+diver+'\n\n'+arr.map(function(j,i){var b=byId('boats',j.boat_id)||{};var svc=(S.data.settings.services.find(function(s){return s.id===j.service_id;})||{}).name||'Servico';
    return (i+1)+'. '+(b.name||'')+(b.length_ft?" ("+b.length_ft+"'"+(b.make?' '+b.make:'')+')':'')+'\n   '+(b.marina||'marina nao informada')+(b.slip?' / slip '+b.slip:'')+'\n   '+svc+(j.optional_time?' — '+j.optional_time:'')+(b.access_notes?'\n   🔑 '+b.access_notes:'')+(b.require_video?'\n   📹 gravar video':'');}).join('\n\n');
  openModal('Texto do dia (WhatsApp)',t);
}

// ================= router =================
function render(){
  var h=location.hash||'#/dashboard';
  try{
    if(!isAdmin()&&(h.indexOf('#/clients')===0||h.indexOf('#/boats')===0||h.indexOf('#/finance')===0)){ location.hash='#/agenda'; return; }
    if(h.indexOf('#/job/')===0) return viewJob(Number(h.split('/')[2]));
    if(h.indexOf('#/agenda')===0) return viewAgenda();
    if(h.indexOf('#/clients')===0) return viewClients();
    if(h.indexOf('#/boats')===0) return viewBoats();
    if(h.indexOf('#/finance')===0) return viewFinance();
    if(h.indexOf('#/settings')===0) return viewSettings();
    return viewDashboard();
  }catch(e){ shell('dashboard','<div class="card"><p style="color:var(--bad)">Erro: '+esc(e.message)+'</p><button class="btn" onclick="render()">Tentar de novo</button></div>'); }
}
window.addEventListener('hashchange',render);
load();
render();
</script>
</body>
</html>
